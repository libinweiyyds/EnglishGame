<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>�� 分类小达人 · 分一分</title>
    <link rel="stylesheet" href="./assets/emoji.css" />
    <link rel="stylesheet" href="./common.css" />
    <link rel="stylesheet" href="./game.css" />
    <link rel="stylesheet" href="./game-groups.css" />
</head>
<body class="theme-sunny">
<div class="bg-decor">
    <span class="balloon b1">��</span>
    <span class="balloon b2">��</span>
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="sparkle s1">✨</span>
    <span class="sparkle s2">⭐</span>
    <span class="sparkle s3">✨</span>
    <span class="sparkle s4">⭐</span>
</div>

<header class="topbar">
    <div class="logo">
        <span class="logo-mark">��</span>
        <span class="logo-text">分类<em>小达人</em></span>
    </div>
    <div class="topbar-actions">
        <a class="chip-btn" href="./index.html">← 回到大厅</a>
        <button class="chip-btn sound-btn" id="soundBtn" onclick="toggleSound()">�� 声音: 开</button>
    </div>
</header>

<main>
    <div class="hud">
        <div class="hud-left">
            <span class="hud-emoji">��</span>
            <span class="hud-label">第 <strong id="roundStat">1</strong> / <span id="totalRounds">5</span> 题</span>
        </div>
        <div class="hud-progress">
            <div class="progress-bar"><i id="progressFill"></i></div>
        </div>
        <div class="hud-right">
            <span class="hud-emoji">⭐</span>
            <span class="hud-label">得分 <strong id="scoreStat">0</strong></span>
            <span class="hud-streak" id="streakBadge"></span>
        </div>
    </div>

    <div class="stage-panel stage-sunny">
        <div class="stage-emoji-deco">
            <span>��</span><span>��</span><span>✨</span>
        </div>

        <div class="stage-header">
            <div class="stage-badge">�� 分一分</div>
            <h2 class="stage-question" id="instruction">拖动词到正确的分类里</h2>
            <p class="stage-instruction">把下面的词拖到对应的分类中</p>
        </div>

        <!-- 分类容器（拖动目标）-->
        <div class="cat-zones" id="catZones"></div>

        <!-- 词池（拖动源）-->
        <div class="word-pool" id="wordPool">
            <span class="pool-label">词池</span>
            <div class="pool-words" id="poolWords"></div>
        </div>

        <div class="feedback-line" id="feedback"></div>

        <div class="hint-row">
            <button class="act-btn act-undo" id="resetBtn" onclick="resetRound()">重置本轮</button>
            <button class="act-btn act-submit" id="checkBtn" onclick="checkAnswer()" disabled>检查答案</button>
            <button class="act-btn act-reveal" id="revealBtn" onclick="revealAnswer()">查看答案</button>
        </div>

        <div class="hint-row">
            <button class="hint-btn" id="hintBtn" onclick="toggleHint()">�� 我要看提示</button>
            <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">⏭ 跳过</button>
        </div>
        <div class="hint-text" id="hintText"></div>
        <div class="solution-box" id="solutionBox">
            <div class="solution-title">✨ 小知识</div>
            <div class="solution-content" id="solutionContent"></div>
        </div>

        <div class="next-row">
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
        </div>
    </div>
</main>

<footer>�� 分类小达人 · 拖动词条到对应分类</footer>

<script src="./questions.js"></script>
<script src="./common.js"></script>
<script>
const GAME_ID = 'groups';
let questions = [];
let roundIndex = 0, score = 0, streak = 0, answered = false;
let currentQ = null;
// 词条被拖到哪个分类: { word: catIndexOrNull }
// catIndex === null 表示还在词池
let wordPlacements = {}; // word -> catIndex (null 表示在词池)
let dragData = null;

async function init() {
    const bank = await loadQuestionBank();
    const diff = getDifficulty();
    questions = shuffleArray([...(bank[GAME_ID]?.[diff] || bank[GAME_ID]?.easy || [])]);
    if (questions.length === 0) {
        document.querySelector('.stage-panel').innerHTML = '<div class="empty-state">�� 这个难度还没有题目，换一个试试吧！<br/><a class="chip-btn" style="display:inline-block;margin-top:16px;" href="./index.html">返回大厅</a></div>';
        return;
    }
    document.getElementById('totalRounds').textContent = questions.length;
    renderQuestion();
}

function renderQuestion() {
    if (roundIndex >= questions.length) { showResult(); return; }
    answered = false;
    currentQ = questions[roundIndex];
    wordPlacements = {};

    document.getElementById('roundStat').textContent = roundIndex + 1;
    document.getElementById('scoreStat').textContent = score;
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('hintText').classList.remove('show');
    document.getElementById('solutionBox').classList.remove('show');
    document.getElementById('nextBtn').classList.remove('show');
    document.getElementById('hintBtn').disabled = false;
    document.getElementById('skipBtn').disabled = false;
    document.getElementById('resetBtn').disabled = false;
    document.getElementById('revealBtn').disabled = false;

    document.getElementById('instruction').textContent = currentQ.instruction || '拖动词到正确的分类里';
    document.getElementById('hintText').textContent = getHintByGame(GAME_ID);
    document.getElementById('solutionContent').textContent = currentQ.extra || '';

    // 解析所有词
    const allWords = (currentQ.question || '').split(',').map(s => s.trim()).filter(Boolean);
    allWords.forEach(w => { wordPlacements[w] = null; });

    renderZones();
    renderPool();
    updateCheckButton();
    updateProgress();
}

function renderZones() {
    const zones = document.getElementById('catZones');
    const cats = currentQ.categories || [];
    zones.innerHTML = cats.map((cat, i) => `
        <div class="cat-zone" data-cat="${i}" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
            <div class="cat-zone-head">
                <span class="cat-name">${escapeHtml(cat.name)}</span>
            </div>
            <div class="cat-zone-words" data-cat="${i}"></div>
        </div>
    `).join('');
}

function renderPool() {
    const pool = document.getElementById('poolWords');
    // 清除之前的对错样式（用户重新拖动时）
    document.querySelectorAll('.draggable-word.placed-correct, .draggable-word.placed-wrong').forEach(el => {
        el.classList.remove('placed-correct', 'placed-wrong');
    });
    // 显示所有未分配的词
    pool.innerHTML = Object.keys(wordPlacements).filter(w => wordPlacements[w] === null).map(w =>
        `<span class="draggable-word" draggable="true" data-word="${escapeHtml(w)}" ondragstart="onDragStart(event)" ondragend="onDragEnd(event)">${escapeHtml(w)}</span>`
    ).join('');
    // 更新每个分类区已分配的词
    const cats = currentQ.categories || [];
    cats.forEach((cat, i) => {
        const zoneWords = document.querySelector(`.cat-zone-words[data-cat="${i}"]`);
        if (!zoneWords) return;
        const wordsInCat = Object.keys(wordPlacements).filter(w => wordPlacements[w] === i);
        // 留 placeholder
        const placeholder = wordsInCat.length === 0 ? '<span class="zone-placeholder">拖到这里</span>' : '';
        zoneWords.innerHTML = wordsInCat.map(w =>
            `<span class="draggable-word in-zone" draggable="true" data-word="${escapeHtml(w)}" ondragstart="onDragStart(event)" ondragend="onDragEnd(event)">${escapeHtml(w)}</span>`
        ).join('') + placeholder;
    });
    updateCheckButton();
}

function onDragStart(e) {
    const word = e.target.dataset.word;
    dragData = word;
    e.dataTransfer.setData('text/plain', word);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => e.target.classList.add('dragging'), 0);
}

function onDragEnd(e) {
    e.target.classList.remove('dragging');
    dragData = null;
    document.querySelectorAll('.cat-zone.drag-over').forEach(z => z.classList.remove('drag-over'));
}

function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const zone = e.currentTarget;
    zone.classList.add('drag-over');
}

function onDragLeave(e) {
    const zone = e.currentTarget;
    if (e.target === zone) zone.classList.remove('drag-over');
}

function onDrop(e) {
    e.preventDefault();
    const zone = e.currentTarget;
    zone.classList.remove('drag-over');
    const word = e.dataTransfer.getData('text/plain') || dragData;
    if (!word || !(word in wordPlacements)) return;
    // 分类区 drop
    let catIndex = null;
    if (zone.classList.contains('cat-zone')) {
        catIndex = parseInt(zone.dataset.cat, 10);
    } else if (zone.id === 'poolWords' || zone.closest('#wordPool')) {
        catIndex = null;
    }
    wordPlacements[word] = catIndex;
    renderPool();
    playPop();
}

function updateCheckButton() {
    const total = Object.keys(wordPlacements).length;
    const placed = Object.values(wordPlacements).filter(v => v !== null).length;
    document.getElementById('checkBtn').disabled = (placed < total) || answered;
}

function checkAnswer() {
    if (answered) return;
    const cats = currentQ.categories || [];
    let correctCount = 0;
    let totalPlaced = 0;
    // 检查每个词的归属
    cats.forEach((cat, ci) => {
        const correctSet = new Set(cat.words.map(w => w.toLowerCase()));
        Object.keys(wordPlacements).forEach(w => {
            if (wordPlacements[w] === ci) {
                totalPlaced++;
                if (correctSet.has(w.toLowerCase())) correctCount++;
            }
        });
    });

    const ok = correctCount === Object.keys(wordPlacements).length && totalPlaced === Object.keys(wordPlacements).length;

    if (ok) {
        answered = true;
        score += 100;
        streak += 1;
        if (streak >= 2) showStreak(streak);
        document.getElementById('feedback').innerHTML = `<span class="feedback-good">�� 分得对！<small>+100 ⭐</small></span>`;
        document.getElementById('solutionBox').classList.add('show');
        playPop();
        spawnConfetti(document.querySelector('.stage-panel'), 25);
        spawnFloatingEmoji('��', document.querySelector('.stage-panel'));
        document.getElementById('scoreStat').textContent = score;
        document.getElementById('nextBtn').classList.add('show');
        document.getElementById('hintBtn').disabled = true;
        document.getElementById('skipBtn').disabled = true;
        document.getElementById('checkBtn').disabled = true;
        document.getElementById('resetBtn').disabled = true;
        document.getElementById('revealBtn').disabled = true;
        // 锁定所有拖动元素
        document.querySelectorAll('.draggable-word').forEach(el => el.setAttribute('draggable', 'false'));
    } else {
        // 失败：允许继续拖动 / 重置 / 再次检查 / 查看答案
        streak = 0;
        const wrongCount = totalPlaced - correctCount;
        document.getElementById('feedback').innerHTML = `<span class="feedback-bad">�� 还有 ${wrongCount} 个分错了～ 再试试</span>`;
        // 高亮显示错误放置（红框）和正确放置（绿框）
        cats.forEach((cat, ci) => {
            const correctSet = new Set(cat.words.map(w => w.toLowerCase()));
            const zone = document.querySelector(`.cat-zone[data-cat="${ci}"]`);
            if (!zone) return;
            Object.keys(wordPlacements).forEach(w => {
                if (wordPlacements[w] === ci) {
                    const wordEl = zone.querySelector(`.draggable-word[data-word="${cssEscape(w)}"]`);
                    if (wordEl) {
                        if (correctSet.has(w.toLowerCase())) wordEl.classList.add('placed-correct');
                        else wordEl.classList.add('placed-wrong');
                    }
                }
            });
        });
        // 反馈后清掉红绿样式，用户可以重新拖动
    }
    updateProgress();
}

function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[\\"]/g, '\\$&');
}

function resetRound() {
    Object.keys(wordPlacements).forEach(w => wordPlacements[w] = null);
    renderPool();
    document.getElementById('feedback').innerHTML = '';
}

function revealAnswer() {
    if (!currentQ) return;
    const cats = currentQ.categories || [];
    // 把所有词强制放到正确分类
    cats.forEach((cat, ci) => {
        cat.words.forEach(w => {
            if (w in wordPlacements) wordPlacements[w] = ci;
        });
    });
    // 干扰词留在词池
    renderPool();
    document.getElementById('feedback').innerHTML = `<span class="feedback-good">✨ 已显示正确答案</span>`;
    // 查看答案后禁用自己，但保留重置和继续
    document.getElementById('revealBtn').disabled = true;
    document.getElementById('checkBtn').disabled = true;
    // 锁定所有拖动（已经显示正确答案了）
    document.querySelectorAll('.draggable-word').forEach(el => el.setAttribute('draggable', 'false'));
}

function updateProgress() {
    const pct = (roundIndex / questions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
}

function showStreak(n) {
    const badge = document.getElementById('streakBadge');
    badge.textContent = `�� 连对 ${n} 题！`;
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 1800);
}

function toggleHint() { document.getElementById('hintText').classList.toggle('show'); }

function skipQuestion() {
    if (answered) return;
    answered = true;
    streak = 0;
    document.getElementById('feedback').innerHTML = `<span class="feedback-bad">⏭ 跳过了这题。</span>`;
    document.getElementById('solutionBox').classList.add('show');
    document.getElementById('nextBtn').classList.add('show');
    document.getElementById('hintBtn').disabled = true;
    document.getElementById('skipBtn').disabled = true;
    document.getElementById('checkBtn').disabled = true;
    document.getElementById('resetBtn').disabled = true;
    // 显示正确分类
    const cats = currentQ.categories || [];
    cats.forEach((cat, ci) => {
        const zoneWords = document.querySelector(`.cat-zone-words[data-cat="${ci}"]`);
        if (!zoneWords) return;
        zoneWords.innerHTML = cat.words.map(w => `<span class="draggable-word in-zone" style="background:#c8f5e0;border-color:var(--c-mint);">${escapeHtml(w)}</span>`).join('');
    });
    // 清空词池
    document.getElementById('poolWords').innerHTML = '';
    playPop();
}

function nextQuestion() { roundIndex++; renderQuestion(); }

function showResult() {
    const total = questions.length;
    const pct = score / (total * 100);
    let stars, title, msg;
    if (pct >= 1) { stars = '⭐⭐⭐'; title = '�� 分类大师！'; msg = '你有一双会发现的眼睛！'; }
    else if (pct >= 0.6) { stars = '⭐⭐☆'; title = '�� 不错！'; msg = '分类越来越好啦～'; }
    else { stars = '⭐☆☆'; title = '�� 加油！'; msg = '分类需要练习，你行的！'; }

    const panel = document.querySelector('.stage-panel');
    panel.innerHTML = `
        <div class="result-screen">
            <div class="result-trophy">��</div>
            <h2>${title}</h2>
            <div class="result-stars">${stars}</div>
            <div class="result-score">${score}<small> / ${total * 100}</small></div>
            <p>${msg}</p>
            <div class="result-actions">
                <a class="next-btn" href="./game-groups.html">�� 再玩一次</a>
                <a class="home-btn" href="./index.html">�� 回大厅</a>
            </div>
        </div>
    `;
    playWin();
    spawnConfetti(panel, 60);
}

init();
</script>
</
