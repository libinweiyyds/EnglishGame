<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧩 词语桥梁 · 找规律</title>
    <link rel="stylesheet" href="./assets/emoji.css" />
    <link rel="stylesheet" href="./common.css" />
    <link rel="stylesheet" href="./game.css" />
    <link rel="stylesheet" href="./game-connect.css" />
</head>
<body class="theme-purple">
<div class="bg-decor">
    <span class="balloon b1">🎈</span>
    <span class="balloon b2">🎈</span>
    <span class="cloud c1">~</span>
    <span class="cloud c2">~</span>
    <span class="sparkle s1">✨</span>
    <span class="sparkle s2">⭐</span>
    <span class="sparkle s3">✨</span>
    <span class="sparkle s4">⭐</span>
</div>

<header class="topbar">
    <div class="logo">
        <span class="logo-mark">🧩</span>
        <span class="logo-text">词语<em>桥梁</em></span>
    </div>
    <div class="topbar-actions">
        <a class="chip-btn" href="./index.html">◀ 回到大厅</a>
        <button class="chip-btn sound-btn" id="soundBtn" onclick="toggleSound()">🔊 声音: 开</button>
    </div>
</header>

<main>
    <div class="hud">
        <div class="hud-left">
            <span class="hud-emoji">🎯</span>
            <span class="hud-label">第 <strong id="roundStat">1</strong> / <span id="totalRounds">5</span> 题</span>
        </div>
        <div class="hud-progress">
            <div class="progress-bar"><i id="progressFill"></i></div>
        </div>
        <div class="hud-right">
            <span class="hud-emoji"></span>
            <span class="hud-label">得分 <strong id="scoreStat">0</strong></span>
            <span class="hud-streak" id="streakBadge"></span>
        </div>
    </div>

    <div class="stage-panel stage-purple">
        <div class="stage-emoji-deco">
            <span></span><span></span><span></span>
        </div>

        <div class="stage-header">
            <div class="stage-badge">🧩 词语桥梁</div>
            <h2 class="stage-question" id="instruction">看看左边一对的关系，把右边也连起来！</h2>
        </div>

        <!-- 桥梁式题面 -->
        <div class="bridge-board">
            <div class="bridge-side">
                <div class="bridge-node" id="leftNodeA"></div>
                <div class="bridge-link">
                    <span class="bridge-line"></span>
                    <span class="bridge-arrow">▶</span>
                </div>
                <div class="bridge-node" id="leftNodeB"></div>
            </div>

            <div class="bridge-divider">
                <span class="divider-eq">＝</span>
                <span class="divider-eq">＝</span>
            </div>

            <div class="bridge-side">
                <div class="bridge-node" id="rightNodeA"></div>
                <div class="bridge-link">
                    <span class="bridge-line bridge-line-q"></span>
                    <span class="bridge-arrow bridge-arrow-q">▶</span>
                </div>
                <div class="bridge-node bridge-node-q">？</div>
            </div>
        </div>

        <!-- 选项 -->
        <div class="options-grid" id="optionsGrid"></div>

        <div class="feedback-line" id="feedback"></div>

        <div class="hint-row">
            <button class="hint-btn" id="hintBtn" onclick="toggleHint()">💡 我要看提示</button>
            <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">▶▶ 跳过</button>
        </div>
        <div class="hint-text" id="hintText"></div>
        <div class="solution-box" id="solutionBox">
            <div class="solution-title">✨ 小知识</div>
            <div class="solution-content" id="solutionContent"></div>
        </div>

        <div class="next-row">
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 ▶</button>
        </div>
    </div>
</main>

<footer>🧩 词语桥梁 · 找出 A:B = C:? 的关系</footer>

<script src="./questions.js"></script>
<script src="./common.js"></script>
<script>
const GAME_ID = 'connect';
let questions = [];
let roundIndex = 0, score = 0, streak = 0, answered = false;

function emojiForPair(word) {
    return '';
}

async function init() {
    const bank = await loadQuestionBank();
    const diff = getDifficulty();
    questions = shuffleArray([...(bank[GAME_ID]?.[diff] || bank[GAME_ID]?.easy || [])]);
    if (questions.length === 0) {
        document.querySelector('.stage-panel').innerHTML = '<div class="empty-state"> 这个难度还没有题目，换一个试试吧！<br/><a class="chip-btn" style="display:inline-block;margin-top:16px;" href="./index.html">返回大厅</a></div>';
        return;
    }
    document.getElementById('totalRounds').textContent = questions.length;
    renderQuestion();
}

function renderQuestion() {
    if (roundIndex >= questions.length) { showResult(); return; }
    answered = false;
    document.getElementById('roundStat').textContent = roundIndex + 1;
    document.getElementById('scoreStat').textContent = score;
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('hintText').classList.remove('show');
    document.getElementById('solutionBox').classList.remove('show');
    document.getElementById('nextBtn').classList.remove('show');
    document.getElementById('hintBtn').disabled = false;
    document.getElementById('skipBtn').disabled = false;

    const q = questions[roundIndex];
    document.getElementById('instruction').textContent = q.instruction || '找出规律，把空也填上！';
    document.getElementById('hintText').textContent = getHintByGame(GAME_ID);
    document.getElementById('solutionContent').textContent = q.extra || '';

    // 解析 "A : B :: C : ?"
    const parts = (q.question || '').split('::');
    const left = (parts[0] || '').split(':').map(s => s.trim());
    const right = (parts[1] || '').split(':').map(s => s.trim());

    document.getElementById('leftNodeA').innerHTML = `
        <span class="bridge-emoji">${emojiForPair(left[0])}</span>
        <span class="bridge-label">${escapeHtml(left[0] || 'A')}</span>
    `;
    document.getElementById('leftNodeB').innerHTML = `
        <span class="bridge-emoji">${emojiForPair(left[1])}</span>
        <span class="bridge-label">${escapeHtml(left[1] || 'B')}</span>
    `;
    document.getElementById('rightNodeA').innerHTML = `
        <span class="bridge-emoji">${emojiForPair(right[0])}</span>
        <span class="bridge-label">${escapeHtml(right[0] || 'C')}</span>
    `;

    // 选项
    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = q.options.map((opt, i) => {
        return `
            <button class="option-tile" data-value="${escapeHtml(opt)}" onclick="choose(this)">
                <span class="option-text">${escapeHtml(opt)}</span>
            </button>`;
    }).join('');

    updateProgress();
}

function updateProgress() {
    const pct = (roundIndex / questions.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
}

function choose(btn) {
    if (answered) return;
    const value = btn.dataset.value;
    const correct = questions[roundIndex].answer;

    const ok = value === correct;
    if (ok) {
        answered = true;
        score += 100;
        streak += 1;
        if (streak >= 2) showStreak(streak);
        document.querySelectorAll('.option-tile').forEach(b => {
            b.disabled = true;
            if (b.dataset.value === correct) b.classList.add('correct');
        });
        btn.classList.add('correct');
        playPop();
        spawnConfetti(document.querySelector('.stage-panel'), 25);
        spawnFloatingEmoji('', document.querySelector('.stage-panel'));
        document.getElementById('feedback').innerHTML = `<span class="feedback-good"> 完美对接！<small>+100 </small></span>`;
        document.getElementById('solutionBox').classList.add('show');
        document.getElementById('nextBtn').classList.add('show');
        document.getElementById('hintBtn').disabled = true;
        document.getElementById('skipBtn').disabled = true;
    } else {
        // 错选：标记这个选项，替换文字为"英文(中文)"，不解锁其它选项
        streak = 0;
        btn.classList.add('wrong');
        btn.disabled = true;
        const span = btn.querySelector('.option-text');
        const zh = translateZh(value);
        if (span) span.textContent = zh ? `${value}（${zh}）` : `${value}`;
        playError();
        document.getElementById('feedback').innerHTML = `<span class="feedback-bad"> 不是这个～ 再想想</span>`;
    }
    document.getElementById('scoreStat').textContent = score;
    updateProgress();
}

function showStreak(n) {
    const badge = document.getElementById('streakBadge');
    badge.textContent = ` 连对 ${n} 题！`;
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 1800);
}

function toggleHint() { document.getElementById('hintText').classList.toggle('show'); }

function skipQuestion() {
    if (answered) return;
    answered = true;
    streak = 0;
    const correct = questions[roundIndex].answer;
    document.querySelectorAll('.option-tile').forEach(b => {
        b.disabled = true;
        if (b.dataset.value === correct) b.classList.add('correct');
    });
    document.getElementById('feedback').innerHTML = `<span class="feedback-bad">▶▶ 跳过了这题。</span>`;
    document.getElementById('solutionBox').classList.add('show');
    document.getElementById('nextBtn').classList.add('show');
    document.getElementById('hintBtn').disabled = true;
    document.getElementById('skipBtn').disabled = true;
    playPop();
}

function nextQuestion() { roundIndex++; renderQuestion(); }

function showResult() {
    const total = questions.length;
    const pct = score / (total * 100);
    let stars, title, msg;
    if (pct >= 1) { stars = ''; title = ' 🌉 桥梁大师！'; msg = '你的逻辑能力超棒！'; }
    else if (pct >= 0.6) { stars = ''; title = ' 不错！'; msg = '再多练几次就更稳了～'; }
    else { stars = ''; title = ' 加油！'; msg = '每一道题都在让你变聪明！'; }

    const panel = document.querySelector('.stage-panel');
    panel.innerHTML = `
        <div class="result-screen">
            <div class="result-trophy">🏆</div>
            <h2>${title}</h2>
            <div class="result-stars">${stars}</div>
            <div class="result-score">${score}<small> / ${total * 100}</small></div>
            <p>${msg}</p>
            <div class="result-actions">
                <a class="next-btn" href="./game-connect.html"> 再玩一次</a>
                <a class="home-btn" href="./index.html"> 回大厅</a>
            </div>
        </div>
    `;
    playWin();
    spawnConfetti(panel, 60);
}

init();
</script>
</body>
</html>
